# Production deploys ONLY from published releases (tags vX.Y.Z), never
# from pushes to main (Vercel's Ignored Build Step skips those). The Vercel
# CLI deploy in the shared workflow is not subject to that skip. See
# docs/RELEASE.md for the policy and the MVP checklist gating v1.0.0.
# Without VERCEL_TOKEN it logs and exits. Each app is its own Vercel project
# whose Root Directory points at apps/web or apps/admin.
# Release-please makes one tag per app (web-vX.Y.Z, admin-vX.Y.Z); each job
# runs only for its own tag, so an app deploys only when its own
# files changed. Shared packages are never released alone.
name: Deploy

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  web:
    if: startsWith(github.event.release.tag_name, 'web-v')
    uses: akhiakl/ci-workflows/.github/workflows/deploy-vercel.yml@v1.4.0
    with:
      org-id: team_limfPNcBoq9EgLcZU3PIRK8J
      project-id: prj_s5JbG1NXUZmlPut6nTqrpW4aJE1W
      node-version: "22"
      smoke-url: https://www.drawmytrip.click
    secrets: inherit

  # The admin app is its own Vercel project (Root Directory apps/admin).
  admin:
    if: startsWith(github.event.release.tag_name, 'admin-v')
    uses: akhiakl/ci-workflows/.github/workflows/deploy-vercel.yml@v1.4.0
    with:
      org-id: team_limfPNcBoq9EgLcZU3PIRK8J
      project-id: prj_xIiYiOh1CIbbzTm4JwFLoFVCOBwB
      node-version: "22"
      smoke-url: https://drawmytrip-admin.vercel.app/api/health
    secrets: inherit
