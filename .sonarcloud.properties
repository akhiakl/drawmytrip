# SonarQube Cloud Automatic Analysis scope (no CI job, no token).
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/src/test/**,**/e2e/**,**/test/**

# Vendored shadcn primitives follow upstream shape; skip duplication checks.
sonar.cpd.exclusions=apps/*/src/components/ui/**
